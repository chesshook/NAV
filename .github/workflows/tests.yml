name: MCR-L tests

on:
  push:
    branches: ["main", "mcrl-v0.1", "semantic-composition-v0.2", "semantic-composition-v0.3", "semantic-composition-v0.4", "semantic-composition-v0.5", "semantic-composition-v0.6", "semantic-composition-v0.7", "neural-language-foundation-v0.8", "mathematical-semantic-network-v0.9", "mathematical-comprehension-v1.0"]
  pull_request:
    branches: ["main", "mcrl-v0.1", "semantic-composition-v0.2", "semantic-composition-v0.3", "semantic-composition-v0.4", "semantic-composition-v0.5", "semantic-composition-v0.7", "neural-language-foundation-v0.8", "mathematical-semantic-network-v0.9"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run benchmark smoke test
        run: python tools/benchmark.py
